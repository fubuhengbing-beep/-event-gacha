<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>イベントガチャ</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
 background:linear-gradient(135deg,#fff7b2,#d9fff0,#dff2ff);
}
.card{
 width:92%;
 max-width:520px;
 background:white;
 border-radius:28px;
 padding:30px 20px;
 text-align:center;
 box-shadow:0 10px 30px #0002;
}
h1{font-size:32px;margin:5px 0 10px}
.sub{color:#666;margin-bottom:25px}
.machine{
 width:210px;
 height:210px;
 margin:auto;
 border-radius:50%;
 background:white;
 border:10px solid #ffd34d;
 box-shadow:inset 0 0 0 8px #fff1a8,0 8px 20px #0002;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:75px;
}
button{
 margin-top:25px;
 border:0;
 border-radius:999px;
 padding:16px 30px;
 font-size:20px;
 font-weight:bold;
 color:white;
 background:#ff7b8b;
 box-shadow:0 5px 0 #d95767;
}
button:active{
 transform:translateY(4px);
 box-shadow:0 1px 0 #d95767;
}
button:disabled{opacity:.6}
.result{
 min-height:70px;
 margin-top:25px;
 font-size:28px;
 font-weight:bold;
}
.spin{animation:spin .5s linear infinite}
@keyframes spin{
 to{transform:rotate(360deg)}
}
</style>
</head>

<body>
<div class="card">

<h1>🎯 イベントガチャ</h1>
<p class="sub">ボタンを押して景品をゲット！</p>

<div id="machine" class="machine">🎁</div>

<button id="go">ガチャを回す！</button>

<div id="result" class="result">？？？</div>

</div>

<script>

const prizes = [
 "A賞 🎉",
 "B賞 ⭐",
 "C賞 🎁",
 "参加賞 🌟"
];

const weights = [
 10,
 25,
 35,
 30
];

function draw(){

 let total = weights.reduce((a,b)=>a+b,0);
 let r = Math.random()*total;

 for(let i=0;i<prizes.length;i++){

   r -= weights[i];

   if(r < 0){
     return prizes[i];
   }

 }

 return prizes[prizes.length-1];

}

document.getElementById("go").addEventListener("click",function(){

 const button = document.getElementById("go");
 const machine = document.getElementById("machine");
 const result = document.getElementById("result");

 button.disabled = true;

 machine.classList.add("spin");

 result.textContent = "抽選中…";

 setTimeout(function(){

   machine.classList.remove("spin");

   result.textContent = draw();

   button.disabled = false;

 },900);

});

</script>

</body>
</html>
